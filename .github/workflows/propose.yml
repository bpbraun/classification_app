name: Run model

# Manual only, and only from main. Generates data/proposals.json with the ANTHROPIC_API_KEY
# secret stored on the protected "model-run" environment, then pushes it to a new branch so
# a person reviews the citations before they go live.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to use"
        required: false
        default: "claude-sonnet-5-5"

permissions:
  contents: read

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: model-run
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check the model name
        env:
          MODEL: ${{ inputs.model }}
        run: |
          if ! [[ "$MODEL" =~ ^claude-[a-z0-9.-]+$ ]]; then
            echo "Model must look like a Claude model id." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Generate proposals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.model }}
        run: npm run propose
      - run: npm run verify-release
      - name: Push to a review branch
        env:
          # Passed through env, never interpolated into the script, to avoid injection.
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
          REPO: ${{ github.repository }}
        run: |
          branch="model-run-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/proposals.json
          git commit -m "data: model citations from $MODEL"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          gh pr create --base main --head "$branch" \
            --title "Model citations from $MODEL" \
            --body "Generated by the Run model workflow. Review the citations, run \`npm run check\` if CI didn't start, then merge to publish." \
            || echo "Open a pull request from $branch to main to publish these citations."
