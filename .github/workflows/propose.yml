name: Run model

# Manual only. Generates data/proposals.json with the ANTHROPIC_API_KEY repository secret,
# then pushes it to a new branch so a person reviews the citations before they go live.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to use"
        required: false
        default: "claude-sonnet-5-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate proposals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.model }}
        run: npm run propose
      - run: npm run verify-release
      - name: Push to a review branch
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through env, never interpolated into the script, to avoid injection.
          MODEL: ${{ inputs.model }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="model-run-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/proposals.json
          git commit -m "data: model citations from $MODEL"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "Model citations from $MODEL" \
            --body "Generated by the Run model workflow. Review the citations, then merge to publish." \
            || echo "Open a pull request from $branch to publish these citations."
